<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>

    <!-- Glowing Vector Gradients -->
    <radialGradient id="glowPurple" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.35;0.15;0.35" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="70%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.2;0.45;0.2" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowEmerald" cx="50%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25">
        <animate attributeName="stop-opacity" values="0.15;0.35;0.15" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Scanline / Laser Gradient -->
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131d36" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0c1324" stop-opacity="0.96" />
    </linearGradient>

    <!-- Text Highlight Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Filter Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; font-size: 40px; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-weight: 400; font-size: 17px; fill: #94a3b8; letter-spacing: 0.2px; }
    .tagline { font-weight: 600; font-size: 13px; fill: #38bdf8; letter-spacing: 1px; text-transform: uppercase; }
    .pill-text { font-weight: 500; font-size: 12px; fill: #cbd5e1; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glows -->
  <rect width="1200" height="420" fill="url(#glowPurple)" />
  <rect width="1200" height="420" fill="url(#glowCyan)" />
  <rect width="1200" height="420" fill="url(#glowEmerald)" />

  <!-- High-Tech Background Grid -->
  <rect width="1200" height="420" fill="url(#grid)" opacity="0.75" />

  <!-- Dynamic / Animated Vector Similarity Network (Background) -->
  <g opacity="0.65">
    <!-- Connecting Vector Edges -->
    <path d="M 80 100 L 220 70 L 340 130 L 260 220 Z" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="4 4" />
    <path d="M 960 90 L 1100 130 L 1040 250 L 890 200 Z" fill="none" stroke="#06b6d4" stroke-width="1.2" stroke-dasharray="5 3" />
    <path d="M 140 320 L 290 350 L 230 280 Z" fill="none" stroke="#10b981" stroke-width="1.2" stroke-dasharray="4 4" />
    <path d="M 920 330 L 1080 340 L 1120 280 Z" fill="none" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="4 4" />

    <!-- Animated Pulsing Vector Nodes (Left Cluster) -->
    <circle cx="80" cy="100" r="4" fill="#818cf8">
      <animate attributeName="r" values="3;6;3" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="220" cy="70" r="5" fill="#38bdf8">
      <animate attributeName="r" values="4;7;4" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="340" cy="130" r="4" fill="#a855f7">
      <animate attributeName="r" values="3;5;3" dur="4.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="260" cy="220" r="6" fill="#06b6d4">
      <animate attributeName="r" values="5;8;5" dur="5.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="140" cy="320" r="5" fill="#34d399">
      <animate attributeName="r" values="4;7;4" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="290" cy="350" r="4" fill="#38bdf8">
      <animate attributeName="r" values="3;6;3" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Animated Pulsing Vector Nodes (Right Cluster) -->
    <circle cx="960" cy="90" r="5" fill="#06b6d4">
      <animate attributeName="r" values="4;7;4" dur="4.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="1100" cy="130" r="4" fill="#818cf8">
      <animate attributeName="r" values="3;6;3" dur="5.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="1040" cy="250" r="6" fill="#c084fc">
      <animate attributeName="r" values="5;8;5" dur="4.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="890" cy="200" r="4" fill="#38bdf8">
      <animate attributeName="r" values="3;5;3" dur="3.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="920" cy="330" r="5" fill="#10b981">
      <animate attributeName="r" values="4;7;4" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1080" cy="340" r="5" fill="#818cf8">
      <animate attributeName="r" values="4;6;4" dur="4.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Dynamic Sweeping Laser Scan Line -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#scanBeam)" stroke-width="2" opacity="0.7">
    <animate attributeName="y1" values="0;420;0" dur="12s" repeatCount="indefinite" />
    <animate attributeName="y2" values="0;420;0" dur="12s" repeatCount="indefinite" />
  </line>

  <!-- Animated Floating Feature Pills (Surrounding Canvas) -->
  <!-- Top Left Pill -->
  <g filter="url(#badgeShadow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="5s" repeatCount="indefinite" />
    <rect x="70" y="24" width="160" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <text x="150" y="44" text-anchor="middle" class="font-sans pill-text">⚡ High-Scale ANN</text>
  </g>

  <!-- Top Right Pill -->
  <g filter="url(#badgeShadow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,6; 0,0" dur="6s" repeatCount="indefinite" />
    <rect x="960" y="24" width="170" height="30" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
    <text x="1045" y="44" text-anchor="middle" class="font-sans pill-text">🔍 Hybrid Dense + BM25</text>
  </g>

  <!-- Bottom Left Pill -->
  <g filter="url(#badgeShadow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,5; 0,0" dur="5.5s" repeatCount="indefinite" />
    <rect x="80" y="365" width="180" height="30" rx="15" fill="#1e293b" stroke="#34d399" stroke-width="1" stroke-opacity="0.5" />
    <text x="170" y="385" text-anchor="middle" class="font-sans pill-text">🧠 RAG &amp; Embeddings</text>
  </g>

  <!-- Bottom Right Pill -->
  <g filter="url(#badgeShadow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="6.5s" repeatCount="indefinite" />
    <rect x="950" y="365" width="180" height="30" rx="15" fill="#1e293b" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5" />
    <text x="1040" y="385" text-anchor="middle" class="font-sans pill-text">📐 HNSW &amp; Quantization</text>
  </g>

  <!-- FOREGROUND MAIN CONTENT CARD (Solid & High-Contrast, Never Obscured) -->
  <g filter="url(#shadow)">
    <!-- Main Card Body -->
    <rect x="180" y="80" width="840" height="255" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Card Border Top Glowing Accent -->
    <line x1="220" y1="80" x2="980" y2="80" stroke="url(#textGrad)" stroke-width="3" stroke-linecap="round" />

    <!-- Category Pill -->
    <rect x="475" y="105" width="250" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.7" />
    <text x="600" y="122" text-anchor="middle" class="font-sans tagline">Curated Vector Ecosystem</text>

    <!-- Main Title -->
    <text x="600" y="176" text-anchor="middle" class="font-sans title">
      Awesome Vector Database
    </text>
    <text x="600" y="218" text-anchor="middle" class="font-sans title" fill="url(#textGrad)">
      &amp; Semantic Search
    </text>

    <!-- Subtitle -->
    <text x="600" y="260" text-anchor="middle" class="font-sans subtitle">
      SaaS Platforms • Open-Source Engines • Hybrid Retrieval • Embeddings • RAG
    </text>

    <!-- Bottom Feature Badges Inside Card -->
    <g transform="translate(230, 285)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="65" y="18" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">📊 SaaS &amp; Cloud</text>

      <rect x="145" y="0" width="140" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="215" y="18" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">🔓 100% Open Source</text>

      <rect x="300" y="0" width="135" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="367" y="18" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">⚡ Star-Ranked</text>

      <rect x="450" y="0" width="140" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="520" y="18" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">💰 Verified Pricing</text>

      <rect x="605" y="0" width="135" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="672" y="18" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">🆓 Free Tiers</text>
    </g>
  </g>
</svg>
